schema_version: 1

# Milestone 2 detector thresholds. All durations are seconds. Audio level
# values use decibels relative to full scale (dBFS); freeze noise is FFmpeg's
# frame-difference threshold in dB. Ratio values must be greater than 0 and
# no greater than 1.
detectors:
  black:
    min_duration_seconds: 2.0
    pixel_black_threshold: 0.10
    picture_black_ratio: 0.98
  silence:
    min_duration_seconds: 2.0
    noise_threshold_db: -50.0
  freeze:
    min_duration_seconds: 2.5
    noise_threshold_db: -60.0
  audio_peak:
    warning_threshold_dbfs: -1.0
  streams:
    expect_video: true
    expect_audio: true
    missing_video_severity: error
    missing_audio_severity: warning

# Creator package rules. Aspect-ratio tolerance is a relative fraction, so
# 0.02 permits up to a 2% difference from an allowed WIDTH:HEIGHT ratio.
rules:
  profile_id: default
  video:
    minimum_width: 1280
    minimum_height: 720
    allowed_aspect_ratios:
      - "16:9"
      - "9:16"
      - "1:1"
    aspect_ratio_tolerance: 0.02
    require_video: true
    require_audio: true
  title:
    require: true
    maximum_recommended_length: 100
  description:
    require: true
    required_phrases: []
    validate_urls: true
  chapters:
    require: false
    require_first_at_zero: true
  captions:
    require: false
